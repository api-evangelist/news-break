aid: news-break
name: News Break
description: 'NewsBreak is the leading local news and information platform in the United States,
  operated by Particle Media, Inc., a Delaware corporation founded in Silicon Valley in 2015 and
  launched as a mobile app in 2016. Its AI-powered platform serves more than 40 million Americans a
  month with local news, alerts, crime maps, weather, events and community content, connecting local
  users, local content creators and local businesses at scale. NewsBreak exposes two developer
  surfaces. The NewsBreak Advertising API (NewsBreak API for Business) lets technology companies,
  direct advertisers and agencies programmatically manage the NewsBreak Ads Manager: organizations
  and ad accounts, ad-account user roles, campaigns, ad sets with budget, bidding, inventory
  platforms and audience targeting, ads and creative asset upload, account spending caps,
  conversion tracking events, and multidimensional performance reporting. The NewsBreak MSP
  Monetization Reporting API serves the supply side, returning impressions, revenue, publisher net
  revenue and eCPM for publishers and monetization partners. NewsBreak also publishes an llms.txt
  that scopes AI access to its verified local-business content surface.'
