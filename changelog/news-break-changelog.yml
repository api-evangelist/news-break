summary: >-
  NewsBreak publishes a "What's New" page for the MSP Monetization Reporting API, but it carries a
  single entry from the API's launch and has not been updated since. The Advertising API - by far
  the larger surface, and one that visibly grew during 2025-2026 (organization endpoints, ad-account
  user management, account spending caps, the platforms field, playable video creatives) - has NO
  dated changelog at all; changes are only discoverable by diffing help-center articles.
