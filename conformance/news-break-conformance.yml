regulatory_context:
  note: >-
    NewsBreak operates a US consumer advertising platform (legal entity Particle Media, Inc.,
    a Delaware corporation), so CCPA/CPRA and COPPA-adjacent advertising obligations are in scope,
    but NewsBreak publishes no API-level statement of how they are met.
