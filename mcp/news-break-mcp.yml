summary: NewsBreak publishes NO official or hosted MCP server. Searched the NewsBreak documentation, help centers,
  npm (@modelcontextprotocol and newsbreak/particle scopes), PyPI and the public MCP registries on 2026-08-01 and
  found nothing first-party or third-party. This is a CANDIDATE tool surface derived mechanically from the 27 documented
  Advertising API operations - one tool per operationId - so an agent implementer has a grounded starting point.
  Every tool below inherits its real input schema from the parameters and requestBody of the operation it names.
  It is not, and must not be represented as, a NewsBreak product.
server:
  name: news-break
  published: false
  url: null
  transport: null
  note: No hosted endpoint exists. A self-hosted server would front https://business.newsbreak.com/business-api/v1
    with an Access-Token header.
