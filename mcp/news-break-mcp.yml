  detail: authentication/news-break-authentication.yml
agent_cautions:
- No idempotency contract - create_campaign, create_ad_set, create_ad, create_ad_account and upload_ad_asset are
  unsafe to retry and will duplicate on a repeat call. See conventions/news-break-conventions.yml.
- Errors arrive as HTTP 200 with a non-zero body `code`. A tool wrapper MUST parse the body and surface code !=
  0 as a failure, or agents will treat throttling and permission denials as success.
- set_account_spending_cap and the delete_* tools are irreversible money/state operations and should require human
  confirmation.
- No rate-limit headers exist; budget against the published QPS/QPM/QPD tier in rate-limits/news-break-rate-limits.yml.
