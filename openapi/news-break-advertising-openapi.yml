    CreateAdSetRequest:
      type: object
      properties:
        campaignId:
          type: string
          description: ID of campaign.
        name:
          type: string
          description: Descriptive name of the ad set.
        googlePlayId:
          type: string
          description: Package name of an Android app, e.g. com.particlenews.newsbreak. Required only for ad sets of an APP_TRAFFIC campaign.
        iosAppId:
          type: string
          description: Apple App Store URL, formatted http://apps.apple.com/<country>/app/<app-name>/id<store-ID>. Required only for ad sets of an APP_TRAFFIC campaign.
        budgetType:
          type: string
          description: Budget type of the ad set.
          enum:
          - DAILY
          - TOTAL
        budget:
          type: integer
          description: Budget of the ad set in cents.
        startTime:
          type: integer
          description: Start timestamp of the ad set.
        endTime:
          type: integer
          description: End timestamp of the ad set.
        bidType:
          type: string
          description: Bid type of the ad set.
          enum:
          - CPM
          - CPC
          - DAY_ONE_MAX_CONVERSION_VALUE
          - MAX_CONVERSION
          - MAX_CONVERSION_VALUE
          - TARGET_CPA
          - TARGET_ROAS
          - DAY_ONE_TARGET_ROAS
        schedule:
          type: object
          description: 'Schedule of the ad set: a map of week day (0 = Sunday) to hours 0-23.'
          additionalProperties:
            type: array
            items:
              type: integer
        bidRate:
          type: integer
          description: Bid rate of the ad set in cents. Required only when bidType is CPM, CPC or TARGET_CPA.
        roas:
          type: number
          format: double
          description: ROAS of the ad set. Required only when bidType is TARGET_ROAS or DAY_ONE_TARGET_ROAS.
        deliveryRate:
          type: string
          description: Delivery pacing. Required only when bidType is CPM or CPC; defaults to ASAP.
          enum:
          - EVENLY
          - ASAP
        trackingId:
          type: string
          description: Event tracking ID, from getEvents.
        platforms:
          type: array
          description: Inventory platforms. Defaults to ["APP_AND_WEB_UNLIMITED"], which must appear alone. At most one PREMIUM_PARTNERS_* value may appear. Duplicates are rejected.
          items:
            type: string
            enum:
            - APP_AND_WEB_UNLIMITED
            - NEWSBREAK
            - SCOOPZ
            - PREMIUM_PARTNERS_ALL
            - PREMIUM_PARTNERS_GAMING
            - PREMIUM_PARTNERS_NON_GAMING
        targeting:
          $ref: '#/components/schemas/Targeting'
      required:
      - campaignId
      - name
      - budgetType
      - budget
      - startTime
      - endTime
      - bidType
