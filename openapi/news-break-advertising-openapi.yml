components:
  securitySchemes:
    AccessToken:
      type: apiKey
      in: header
      name: Access-Token
      description: Authorized access token. Generate it in the NewsBreak Ad Manager under Resources -> API Access Tokens ("Generate Token"). The token carries the permissions granted by the advertiser.
        Keep it secret.
  schemas:
    Envelope:
      type: object
      description: The standard NewsBreak response envelope. Every operation returns HTTP 200 with a `code` field; code 0 means success and any other value is an error (see Return Codes).
      properties:
        code:
          type: integer
          description: Status code. 0 is successful; see Return Codes.
        errMsg:
          type: string
          description: Error message when code != 0.
        data:
          type: object
          description: Response object.
    Organization:
      type: object
      description: An advertising organization.
      properties:
        id:
          type: string
          description: Organization ID.
        name:
          type: string
          description: Organization name.
    AdAccount:
      type: object
      description: An ad account under an organization.
      properties:
        id:
          type: string
          description: Ad account ID.
        name:
          type: string
          description: Ad account name.
        orgId:
          type: string
          description: Organization ID.
        orgName:
          type: string
          description: Organization name.
        companyName:
          type: string
          description: Company name associated with the ad account.
        createTime:
          type: string
          description: Create time of the ad account.
    Campaign:
      type: object
      description: A NewsBreak advertising campaign.
      properties:
        id:
          type: string
          description: Campaign ID.
        name:
          type: string
          description: Campaign name.
        orgId:
          type: string
          description: Organization ID.
        adAccountId:
          type: string
          description: Ad account ID.
        objective:
          type: string
          description: Objective of the campaign.
          enum:
          - WEB_CONVERSION
          - APP_CONVERSION
          - REACH
          - WEB_TRAFFIC
          - APP_TRAFFIC
        budget:
          type: integer
          description: Campaign budget in cents.
        onlineStatus:
          type: string
          description: Online status of the campaign.
          enum:
          - WARNING
          - INACTIVE
          - ACTIVE
          - DELETED
        status:
          type: string
          description: Campaign status.
          enum:
          - 'ON'
          - 'OFF'
        createTime:
          type: string
          description: Create time of the campaign (unix timestamp as string).
        updateTime:
          type: string
          description: Update time of the campaign (unix timestamp as string).
    AdSet:
      type: object
      description: 'An ad set: budget, bidding, schedule and targeting under a campaign.'
      properties:
        id:
          type: string
          description: Ad set ID.
        name:
          type: string
          description: Ad set name.
        orgId:
          type: string
          description: Organization ID.
        adAccountId:
          type: string
          description: Ad account ID.
        campaignId:
          type: string
          description: Campaign ID.
        trackingId:
          type: string
          description: Event tracking ID.
        budget:
          type: integer
          description: Ad set budget in cents.
        budgetType:
          type: string
          description: Budget type of the ad set.
          enum:
          - DAILY
          - TOTAL
        startTime:
          type: integer
          description: Start timestamp of the ad set.
        endTime:
          type: integer
          description: End timestamp of the ad set.
        bidType:
          type: string
          description: Bid type of the ad set.
          enum:
          - CPM
          - CPC
          - DAY_ONE_MAX_CONVERSION_VALUE
          - MAX_CONVERSION
          - MAX_CONVERSION_VALUE
          - TARGET_CPA
          - TARGET_ROAS
          - DAY_ONE_TARGET_ROAS
        bidRate:
          type: integer
          description: Bid rate of the ad set in cents.
        onlineStatus:
          type: string
          description: Online status of the ad set.
          enum:
          - WARNING
          - INACTIVE
          - ACTIVE
          - DELETED
          - READY
          - COMPLETED
        status:
          type: string
          description: Ad set status.
          enum:
          - 'ON'
          - 'OFF'
        targeting:
          $ref: '#/components/schemas/Targeting'
    Ad:
      type: object
      description: An ad and its creative.
      properties:
        id:
          type: string
          description: Ad ID.
        name:
          type: string
          description: Ad name.
        adAccountId:
          type: string
          description: Ad account ID.
        campaignId:
          type: string
          description: Campaign ID.
        adSetId:
          type: string
          description: Ad set ID.
        clickTrackingUrl:
          type: array
          description: Click tracking URL list.
          items:
            type: string
        impressionTrackingUrl:
          type: array
          description: Impression tracking URL list.
          items:
            type: string
        status:
          type: string
          description: Ad status.
          enum:
          - 'ON'
          - 'OFF'
        onlineStatus:
          type: string
          description: Online status of the ad.
          enum:
          - WARNING
          - INACTIVE
          - ACTIVE
          - DELETED
          - PENDING
          - REJECTED
        creative:
          $ref: '#/components/schemas/Creative'
        createTime:
          type: string
          description: Create time of the ad.
        updateTime:
          type: string
          description: Update time of the ad.
    Creative:
      type: object
      description: The creative rendered for an ad.
      properties:
        type:
          type: string
          description: Type of this creative.
          enum:
          - IMAGE
          - VIDEO
          - GIF
          - PLAYABLE_VIDEO
        headline:
          type: string
          description: Title.
        assetUrl:
          type: string
          description: URL of the IMAGE, VIDEO or GIF. Must be an asset uploaded to the NewsBreak CDN via uploadAdAssets, and include your account ID.
        coverUrl:
          type: string
          description: Cover image of the video. Only applicable for VIDEO and PLAYABLE_VIDEO. Must be a NewsBreak CDN asset.
        playableAssetUrl:
          type: string
          description: URL of the interactive playable HTML file. Required when type is PLAYABLE_VIDEO. Must be an .html asset uploaded to the NewsBreak CDN.
        description:
          type: string
          description: Description of this ad.
        callToAction:
          type: string
          description: Text on the button.
        brandName:
          type: string
          description: Brand name of this ad.
        logoUrl:
          type: string
          description: URL of the logo.
        clickThroughUrl:
          type: string
          description: Landing page URL.
      required:
      - type
      - headline
      - assetUrl
      - description
      - callToAction
      - brandName
    Targeting:
      type: object
      description: Audience targeting for an ad set. Each field accepts an AdSetTarget object with positive (include) and/or negative (exclude) lists. Mixing positive and negative is only allowed on location
        and device-location fields.
      additionalProperties:
        $ref: '#/components/schemas/TargetingField'
    TargetingField:
      type: object
      description: An AdSetTarget object with positive (include) and/or negative (exclude) lists.
      properties:
        positive:
          type: array
          description: Values to include. Use ["all"] for unlimited; "all" may not be combined with other values.
          items:
            type: string
        negative:
          type: array
          description: Values to exclude. Only the location and device-location fields support a negative list.
          items:
            type: string
    Event:
      type: object
      description: A conversion tracking event (pixel or postback).
      properties:
        id:
          type: string
          description: Event tracking ID, to be used on an ad set.
        name:
          type: string
          description: Event tracking name.
        orgId:
          type: string
          description: Organization ID.
        type:
          type: string
          description: Event type.
          enum:
          - PIXEL
          - POSTBACK
        eventType:
          type: string
          description: The event type of the tracking event.
        eventParams:
          type: array
          description: Attachable parameters of the tracking event.
          items:
            type: string
        url:
          type: string
          description: URL of the tracking event.
        os:
          type: string
          description: Operating system of the tracking event.
          enum:
          - IOS
          - ANDROID
    ReportRow:
      type: object
      description: One row of report data.
      properties:
        date:
          type: string
          description: Date.
        hour:
          type: string
          description: Hour.
        adAccountId:
          type: string
          description: Ad account ID.
        adAccount:
          type: string
          description: Ad account name.
        orgId:
          type: string
          description: Organization ID.
        organization:
          type: string
          description: Organization name.
        campaignId:
          type: string
          description: Campaign ID.
        campaign:
          type: string
          description: Campaign name.
        adSetId:
          type: string
          description: Ad set ID.
        adSet:
          type: string
          description: Ad set name.
        adId:
          type: string
          description: Ad ID.
        ad:
          type: string
          description: Ad name.
        placement:
          type: string
          description: Placement name.
        country:
          type: string
          description: Country name.
        costDecimal:
          type: number
          format: double
          description: Cost in cents.
        cost:
          type: integer
          description: Cost in cents.
        impression:
          type: integer
          description: Impressions.
        click:
          type: integer
          description: Clicks.
        conversion:
          type: integer
          description: Conversions.
        conversionValueDecimal:
          type: number
          format: double
          description: Total conversion value in cents.
        conversionValue:
          type: integer
          description: Total conversion value.
        cpmDecimal:
          type: number
          format: double
          description: CPM in cents, -1.0 if N/A.
        cpm:
          type: integer
          description: CPM in cents, -1 if N/A.
        cpcDecimal:
          type: number
          format: double
          description: CPC in cents, -1.0 if N/A.
        cpc:
          type: integer
          description: CPC in cents, -1 if N/A.
        cpaDecimal:
          type: number
          format: double
          description: Cost per action in cents, -1.0 if N/A.
        cpa:
          type: integer
          description: Cost per action in cents, -1 if N/A.
        ctr:
          type: number
          description: Click-through rate.
    ReportRequest:
      type: object
      description: A report definition, shared by runSynchronousReport and createCustomReport.
      properties:
        name:
          type: string
          description: Name of this report.
        timezone:
          type: string
          description: Valid timezone string, such as UTC, America/Los_Angeles or Asia/Shanghai. Default is PDT.
        dateRange:
          type: string
          description: Date range of the report.
          enum:
          - FIXED
          - YESTERDAY
          - LAST_7_DAYS
          - LAST_14_DAYS
          - LAST_30_DAYS
          - MONTH_TO_DATE
          - QUARTER_TO_DATE
          - TODAY
        startDate:
          type: string
          description: Start date, formatted YYYY-MM-DD. Required when dateRange is FIXED.
        endDate:
          type: string
          description: End date, formatted YYYY-MM-DD. Required when dateRange is FIXED.
        filter:
          type: string
          description: Filter type.
          enum:
          - ORG
          - AD_ACCOUNT
          - CAMPAIGN
          - AD_SET
          - AD
        dataSource:
          type: string
          description: Data source type. HOURLY is the official basis for income settlement on NewsBreak.
          enum:
          - HOURLY
          - REALTIME
        filterIds:
          type: array
          description: IDs matching the filter type.
          items:
            type: string
        dimensions:
          type: array
          description: Report dimensions (UPPERCASE only). HOUR only works with dateRange YESTERDAY, TODAY or a 1-day FIXED range; DATE works with YESTERDAY, TODAY, LAST_7_DAYS, LAST_14_DAYS, LAST_30_DAYS,
            MONTH_TO_DATE or a FIXED range of at most 30 days.
          items:
            type: string
            enum:
            - DATE
            - HOUR
            - ORG
            - AD_ACCOUNT
            - CAMPAIGN
            - AD_SET
            - AD
            - PLACEMENT
        metrics:
          type: array
          description: Report metrics.
          items:
            type: string
        emails:
          type: array
          description: Email recipients of the report.
          items:
            type: string
        editors:
          type: array
          description: Users allowed to edit the report.
          items:
            type: string
      required:
      - name
      - timezone
      - dateRange
      - dimensions
      - metrics
    CreateAdAccountRequest:
      type: object
      properties:
        adAccountName:
          type: string
          description: Descriptive name of the ad account. 1-256 characters.
        companyName:
          type: string
          description: Company name associated with the ad account. 1-1024 characters.
        industry:
          type: string
          description: Industry classification in the form <category>//<subcategory>, e.g. "Ad Safety Risk//Other". Must match a value from the published industry list.
        orgId:
          type: string
          description: ID of the organization the ad account belongs to.
      required:
      - adAccountName
      - companyName
      - industry
      - orgId
    AddAdAccountUserRequest:
      type: object
      properties:
        orgId:
          type: string
          description: ID of the organization the ad account belongs to.
        adAccountId:
          type: string
          description: ID of the ad account to grant access to. Must belong to orgId.
        email:
          type: string
          description: Email address of the user to add.
        role:
          type: string
          description: Access role to assign on the ad account.
          enum:
          - ACC_ADMIN
          - ACC_OPERATOR
          - ACC_VIEWER
      required:
      - orgId
      - adAccountId
      - email
      - role
    DeleteAdAccountUserRequest:
